apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsdesk-frontend
  namespace: opsdesk
  labels:
    app.kubernetes.io/name: opsdesk-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opsdesk-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsdesk-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: opsdesk/frontend:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3

---

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: opsdesk
  labels:
    app.kubernetes.io/name: frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app.kubernetes.io/name: opsdesk-frontend
