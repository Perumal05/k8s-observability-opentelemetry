apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsdesk-backend
  namespace: opsdesk
  labels:
    app.kubernetes.io/name: opsdesk-backend
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opsdesk-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsdesk-backend
        app.kubernetes.io/component: backend
      annotations:
        instrumentation.opentelemetry.io/inject-python: "opsdesk/opsdesk-python-instrumentation"
    spec:
      containers:
        - name: backend
          image: opsdesk/backend:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: opsdesk-config
            - secretRef:
                name: opsdesk-secret
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3

---

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: opsdesk
  labels:
    app.kubernetes.io/name: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: opsdesk-backend
