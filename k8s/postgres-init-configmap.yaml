apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: opsdesk
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
data:
  01-init.sql: |
    -- ==========================================================
    -- OpsDesk PostgreSQL Initialization & Seed Script
    -- ==========================================================

    -- 1. Create Enums if they do not already exist
    DO $$ BEGIN
        CREATE TYPE user_roles AS ENUM ('REPORTER', 'TECHNICIAN', 'MANAGER');
    EXCEPTION
        WHEN duplicate_object THEN null;
    END $$;

    DO $$ BEGIN
        CREATE TYPE incident_priorities AS ENUM ('LOW', 'MEDIUM', 'HIGH', 'CRITICAL');
    EXCEPTION
        WHEN duplicate_object THEN null;
    END $$;

    DO $$ BEGIN
        CREATE TYPE incident_statuses AS ENUM ('OPEN', 'IN_PROGRESS', 'PENDING', 'RESOLVED', 'CLOSED');
    EXCEPTION
        WHEN duplicate_object THEN null;
    END $$;

    DO $$ BEGIN
        CREATE TYPE incident_categories AS ENUM ('NETWORK', 'DATABASE', 'APPLICATION', 'SECURITY', 'HARDWARE', 'OTHER');
    EXCEPTION
        WHEN duplicate_object THEN null;
    END $$;

    -- 2. Create Tables
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        email VARCHAR(150) NOT NULL UNIQUE,
        role user_roles NOT NULL DEFAULT 'REPORTER',
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS incidents (
        id SERIAL PRIMARY KEY,
        incident_number VARCHAR(50) NOT NULL UNIQUE,
        title VARCHAR(255) NOT NULL,
        description TEXT NOT NULL,
        priority incident_priorities NOT NULL DEFAULT 'MEDIUM',
        status incident_statuses NOT NULL DEFAULT 'OPEN',
        category incident_categories NOT NULL DEFAULT 'APPLICATION',
        reporter_id INTEGER NOT NULL REFERENCES users(id),
        assigned_to INTEGER REFERENCES users(id),
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        resolved_at TIMESTAMPTZ
    );

    CREATE TABLE IF NOT EXISTS comments (
        id SERIAL PRIMARY KEY,
        incident_id INTEGER NOT NULL REFERENCES incidents(id) ON DELETE CASCADE,
        user_id INTEGER NOT NULL REFERENCES users(id),
        comment TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS incident_history (
        id SERIAL PRIMARY KEY,
        incident_id INTEGER NOT NULL REFERENCES incidents(id) ON DELETE CASCADE,
        action VARCHAR(100) NOT NULL,
        old_value VARCHAR(255),
        new_value VARCHAR(255),
        changed_by INTEGER REFERENCES users(id),
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    -- 3. Create Indexes
    CREATE INDEX IF NOT EXISTS ix_users_id ON users (id);
    CREATE INDEX IF NOT EXISTS ix_users_email ON users (email);
    CREATE INDEX IF NOT EXISTS ix_incidents_id ON incidents (id);
    CREATE INDEX IF NOT EXISTS ix_incidents_incident_number ON incidents (incident_number);
    CREATE INDEX IF NOT EXISTS ix_comments_id ON comments (id);
    CREATE INDEX IF NOT EXISTS ix_comments_incident_id ON comments (incident_id);
    CREATE INDEX IF NOT EXISTS ix_incident_history_id ON incident_history (id);
    CREATE INDEX IF NOT EXISTS ix_incident_history_incident_id ON incident_history (incident_id);

    -- 4. Seed Initial Users
    INSERT INTO users (id, name, email, role, created_at) VALUES
        (1, 'Alice Tech', 'alice.tech@opsdesk.io', 'TECHNICIAN', NOW() - INTERVAL '30 days'),
        (2, 'Bob Network', 'bob.network@opsdesk.io', 'TECHNICIAN', NOW() - INTERVAL '30 days'),
        (3, 'Carol DBA', 'carol.dba@opsdesk.io', 'TECHNICIAN', NOW() - INTERVAL '30 days'),
        (4, 'David DevOps', 'david.devops@opsdesk.io', 'TECHNICIAN', NOW() - INTERVAL '30 days'),
        (5, 'Sarah Connor', 'sarah.reporter@opsdesk.io', 'REPORTER', NOW() - INTERVAL '30 days'),
        (6, 'John Doe', 'john.reporter@opsdesk.io', 'REPORTER', NOW() - INTERVAL '30 days'),
        (7, 'Elena Rostova', 'elena.manager@opsdesk.io', 'MANAGER', NOW() - INTERVAL '30 days')
    ON CONFLICT (id) DO UPDATE SET email = EXCLUDED.email;

    SELECT setval('users_id_seq', (SELECT MAX(id) FROM users));

    -- 5. Seed Initial Incidents
    INSERT INTO incidents (id, incident_number, title, description, priority, status, category, reporter_id, assigned_to, created_at, updated_at, resolved_at) VALUES
        (1, 'INC-1001', 'Payment Gateway API Latency Spike (>3500ms)', 'Payment microservice checkout requests are timing out for US-East region users. Error rate increased to 12%.', 'CRITICAL', 'IN_PROGRESS', 'APPLICATION', 5, 1, NOW() - INTERVAL '2 hours', NOW() - INTERVAL '25 minutes', NULL),
        (2, 'INC-1002', 'Core Router BGP Flapping in Zone 2', 'Border Gateway Protocol session flapping on router cr02.sfo. Periodic packet drop of 4% observed.', 'HIGH', 'OPEN', 'NETWORK', 6, 2, NOW() - INTERVAL '4 hours', NOW() - INTERVAL '4 hours', NULL),
        (3, 'INC-1003', 'PostgreSQL Main Replica Replication Lag > 450s', 'Read-replica replica-02 in cluster postgres-prod is lagging behind primary due to heavy batch analytical query.', 'HIGH', 'RESOLVED', 'DATABASE', 5, 3, NOW() - INTERVAL '27 hours', NOW() - INTERVAL '25 hours', NOW() - INTERVAL '25 hours'),
        (4, 'INC-1004', 'SSL Certificate Expiry Warning for internal auth proxy', 'auth-proxy.internal.corp certificate expires in 72 hours. Automated certbot renew failed.', 'MEDIUM', 'PENDING', 'SECURITY', 6, 4, NOW() - INTERVAL '6 hours', NOW() - INTERVAL '1 hour', NULL),
        (5, 'INC-1005', 'Kubelet Memory Pressure on worker-node-04', 'Node worker-04 triggered MemoryPressure taint. Non-critical batch pods being evicted.', 'LOW', 'CLOSED', 'HARDWARE', 5, 4, NOW() - INTERVAL '2 days', NOW() - INTERVAL '42 hours', NOW() - INTERVAL '44 hours')
    ON CONFLICT (id) DO UPDATE SET incident_number = EXCLUDED.incident_number;

    SELECT setval('incidents_id_seq', (SELECT MAX(id) FROM incidents));

    -- 6. Seed Comments
    INSERT INTO comments (id, incident_id, user_id, comment, created_at) VALUES
        (1, 1, 1, 'Investigating upstream third-party gateway response times.', NOW() - INTERVAL '90 minutes'),
        (2, 1, 1, 'Identified connection pool exhaustion on redis cache layer.', NOW() - INTERVAL '25 minutes'),
        (3, 2, 6, 'Automated alert triggered from Prometheus network probe.', NOW() - INTERVAL '230 minutes'),
        (4, 3, 3, 'Terminated blocking query PID 49201. Replication recovered.', NOW() - INTERVAL '25 hours'),
        (5, 4, 4, 'Pending DNS challenge authorization token from infosec team.', NOW() - INTERVAL '1 hour'),
        (6, 5, 4, 'Cleaned up orphaned docker overlay filesystem layers.', NOW() - INTERVAL '44 hours')
    ON CONFLICT (id) DO NOTHING;

    SELECT setval('comments_id_seq', (SELECT MAX(id) FROM comments));

    -- 7. Seed Incident History
    INSERT INTO incident_history (id, incident_id, action, old_value, new_value, changed_by, created_at) VALUES
        (1, 1, 'INCIDENT_CREATED', NULL, 'OPEN', 5, NOW() - INTERVAL '2 hours'),
        (2, 1, 'STATUS_CHANGED', 'OPEN', 'IN_PROGRESS', 1, NOW() - INTERVAL '105 minutes'),
        (3, 1, 'PRIORITY_CHANGED', 'HIGH', 'CRITICAL', 1, NOW() - INTERVAL '95 minutes'),
        (4, 2, 'INCIDENT_CREATED', NULL, 'OPEN', 6, NOW() - INTERVAL '4 hours'),
        (5, 3, 'INCIDENT_CREATED', NULL, 'OPEN', 5, NOW() - INTERVAL '27 hours'),
        (6, 3, 'STATUS_CHANGED', 'OPEN', 'IN_PROGRESS', 3, NOW() - INTERVAL '26 hours'),
        (7, 3, 'STATUS_CHANGED', 'IN_PROGRESS', 'RESOLVED', 3, NOW() - INTERVAL '25 hours'),
        (8, 4, 'INCIDENT_CREATED', NULL, 'OPEN', 6, NOW() - INTERVAL '6 hours'),
        (9, 4, 'STATUS_CHANGED', 'OPEN', 'PENDING', 4, NOW() - INTERVAL '1 hour'),
        (10, 5, 'INCIDENT_CREATED', NULL, 'OPEN', 5, NOW() - INTERVAL '2 days'),
        (11, 5, 'STATUS_CHANGED', 'OPEN', 'RESOLVED', 4, NOW() - INTERVAL '44 hours'),
        (12, 5, 'STATUS_CHANGED', 'RESOLVED', 'CLOSED', 4, NOW() - INTERVAL '42 hours')
    ON CONFLICT (id) DO NOTHING;

    SELECT setval('incident_history_id_seq', (SELECT MAX(id) FROM incident_history));
